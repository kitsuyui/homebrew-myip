name: Update formula
on:
  schedule:
    # weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
concurrency:
  group: update-formula
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Update formula
        run: ./generate.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: 'Update myip formula'
          branch: update-formula
          title: 'Update myip formula'
          body: |
            ## Summary
            - Update myip formula to the latest upstream release
            - Automated update triggered by the scheduled workflow

            ## Validation
            - Formula generated by `./generate.sh`
