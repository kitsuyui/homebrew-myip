name: Update formula
on:
  schedule:
    # weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
concurrency:
  group: update-formula
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update formula
        run: ./generate.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          commit-message: 'Update myip formula'
          branch: update-formula
          title: 'Update myip formula'
          body: |
            ## Summary
            - Update myip formula to the latest upstream release
            - Automated update triggered by the scheduled workflow

            ## Validation
            - Formula generated by `./generate.sh`
